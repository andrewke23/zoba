services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: zoba
      POSTGRES_PASSWORD: zoba
      POSTGRES_DB: zoba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  pgdata:
